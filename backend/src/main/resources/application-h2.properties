# ===================================================================
# CampusCare H2 In-Memory Database Profile (for offline/instant testing)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:campuscare_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

campuscare.jwt.secret=9a4f2c8d3e7b1a5f6e8d2c4b7a9e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d5e
campuscare.jwt.expiration-ms=86400000
campuscare.upload.dir=uploads
