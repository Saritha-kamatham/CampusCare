# ===================================================================
# CampusCare Application Configuration
# ===================================================================
spring.application.name=campuscare-backend
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (MySQL 8.0 default)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campuscare_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Security & JWT Settings
# -------------------------------------------------------------------
campuscare.jwt.secret=${JWT_SECRET:9a4f2c8d3e7b1a5f6e8d2c4b7a9e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d5e}
campuscare.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# File Upload Configuration
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
campuscare.upload.dir=${UPLOAD_DIR:uploads}

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.campuscare=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.socket=INFO
