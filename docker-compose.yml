version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: campuscare-mysql
    restart: always
    environment:
      MYSQL_DATABASE: campuscare_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: campuscare_user
      MYSQL_PASSWORD: campuscare_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    networks:
      - campuscare-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuscare-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/campuscare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: campuscare_user
      SPRING_DATASOURCE_PASSWORD: campuscare_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - campuscare-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campuscare-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - campuscare-network

networks:
  campuscare-network:
    driver: bridge

volumes:
  db_data:
  backend_uploads:
